<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Zarządzanie Członkami - Admin</title>
    <style>
        * { box-sizing: border-box; font-family: sans-serif; }
        body { background: #121212; color: #fff; margin: 0; padding: 2rem; }
        .container { max-width: 900px; margin: 0 auto; }
        table { width: 100%; border-collapse: collapse; background: #1e1e1e; border-radius: 8px; overflow: hidden; margin-top: 1.5rem; border: 1px solid #333; }
        th, td { padding: 1rem; text-align: left; border-bottom: 1px solid #333; }
        th { background: #252525; color: #4CAF50; }
        .badge-admin { background: #4CAF50; color: #fff; padding: 0.2rem 0.6rem; border-radius: 12px; font-size: 0.75rem; }
        .badge-user { background: #555; color: #fff; padding: 0.2rem 0.6rem; border-radius: 12px; font-size: 0.75rem; }
        .btn { padding: 0.5rem 1rem; background: #333; color: #fff; border: none; border-radius: 4px; text-decoration: none; cursor: pointer; font-weight: bold; }
        .btn:hover { background: #444; }
    </style>
</head>
<body>

<div class="container">
    <div style="display: flex; justify-content: space-between; align-items: center;">
        <h1>Panel Administratora - Członkowie Forum</h1>
        <a href="/" class="btn">← Powrót do Forum</a>
    </div>

    <table>
        <thead>
            <tr>
                <th>Nick</th>
                <th>Email</th>
                <th>Ranga</th>
                <th>Data rejestracji</th>
            </tr>
        </thead>
        <tbody id="usersTable">
            <tr><td colspan="4" style="text-align:center;">Ładowanie listy członków...</td></tr>
        </tbody>
    </table>
</div>

<script>
    async function loadUsers() {
        const res = await fetch('/api/admin/users');
        if (!res.ok) {
            alert('Brak uprawnień administratora!');
            window.location.href = '/';
            return;
        }
        const users = await res.json();
        const tbody = document.getElementById('usersTable');

        tbody.innerHTML = users.map(u => `
            <tr>
                <td><strong>${u.username}</strong></td>
                <td>${u.email}</td>
                <td><span class="${u.role === 'admin' ? 'badge-admin' : 'badge-user'}">${u.role.toUpperCase()}</span></td>
                <td>${new Date(u.createdAt).toLocaleDateString('pl-PL')}</td>
            </tr>
        `).join('');
    }

    loadUsers();
</script>

</body>
</html>
