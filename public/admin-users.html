<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zarządzanie Członkami - Admin</title>
    <style>
        body { background: #121212; color: #fff; font-family: sans-serif; padding: 2rem; margin: 0; }
        a { color: #4CAF50; text-decoration: none; display: inline-block; margin-bottom: 1rem; }
        a:hover { text-decoration: underline; }
        h2 { color: #4CAF50; }
        table { width: 100%; border-collapse: collapse; background: #1e1e1e; border-radius: 8px; overflow: hidden; margin-top: 1rem; }
        th, td { padding: 1rem; text-align: left; border-bottom: 1px solid #333; }
        th { background: #2a2a2a; color: #4CAF50; }
        tr:hover { background: #252525; }
        .error { color: #ff5252; text-align: center; padding: 2rem; }
    </style>
</head>
<body>

    <a href="/admin.html">← Powrót do Panelu Admina</a>
    <h2>Panel Administratora - Członkowie Forum</h2>

    <table>
        <thead>
            <tr>
                <th>Nick</th>
                <th>Email</th>
                <th>Ranga</th>
                <th>Data rejestracji</th>
            </tr>
        </thead>
        <tbody id="usersTableBody">
            <tr>
                <td colspan="4" style="text-align: center;">Ładowanie listy członków...</td>
            </tr>
        </tbody>
    </table>

<script>
    async function loadUsers() {
        const tbody = document.getElementById('usersTableBody');

        try {
            const res = await fetch('/api/users', {
                method: 'GET',
                credentials: 'include' // ← KLUCZOWE: wysyła sesję, aby przejść przez requireAuth i requireAdmin
            });

            if (res.status === 401) {
                throw new Error('Musisz być zalogowany!');
            }
            if (res.status === 403) {
                throw new Error('Brak uprawnień administratora!');
            }
            if (!res.ok) {
                throw new Error(`Błąd serwera (${res.status})`);
            }

            const users = await res.json();
            tbody.innerHTML = '';

            if (!users || users.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" style="text-align: center;">Brak użytkowników</td></tr>';
                return;
            }

            users.forEach(user => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${escapeHtml(user.username || 'Brak')}</td>
                    <td>${escapeHtml(user.email || 'Brak')}</td>
                    <td>${escapeHtml(user.role || 'user')}</td>
                    <td>${user.createdAt ? new Date(user.createdAt).toLocaleDateString('pl-PL') : 'Brak'}</td>
                `;
                tbody.appendChild(tr);
            });

        } catch (err) {
            tbody.innerHTML = `<tr><td colspan="4" class="error">Błąd: ${escapeHtml(err.message)}</td></tr>`;

            // Przy błędzie autoryzacji przekieruj do logowania
            if (err.message.includes('zalogowany') || err.message.includes('uprawnien')) {
                setTimeout(() => window.location.href = '/login.html', 2000);
            }
        }
    }

    // Pomocnicza funkcja do zabezpieczenia przed XSS
    function escapeHtml(str) {
        if (str === null || str === undefined) return '';
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    loadUsers();
</script>

</body>
</html>
