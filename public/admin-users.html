<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zarządzanie Członkami - Admin</title>
    <style>
        body { background: #121212; color: #fff; font-family: sans-serif; padding: 2rem; }
        a { color: #4CAF50; text-decoration: none; display: inline-block; margin-bottom: 1rem; }
        table { width: 100%; border-collapse: collapse; background: #1e1e1e; border-radius: 8px; overflow: hidden; }
        th, td { padding: 1rem; text-align: left; border-bottom: 1px solid #333; }
        th { background: #2a2a2a; color: #4CAF50; }
    </style>
</head>
<body>

    <a href="/admin.html">← Powrót do Panelu Admina</a>
    <h2>Panel Administratora - Członkowie Forum</h2>

    <table>
        <thead>
            <tr>
                <th>Nick</th>
                <th>Email</th>
                <th>Ranga</th>
                <th>Data rejestracji</th>
            </tr>
        </thead>
        <tbody id="usersTableBody">
            <tr>
                <td colspan="4" style="text-align: center;">Ładowanie listy członków...</td>
            </tr>
        </tbody>
    </table>

<script>
    async function loadUsers() {
        try {
            const res = await fetch('/api/users', { // Upewnij się, że ta ścieżka zgadza się z Twoim backendem
                method: 'GET',
                credentials: 'include' // ← KLUCZOWE: wysyła sesję, aby przejść przez requireAuth i requireAdmin
            });

            if (!res.ok) {
                throw new Error('Brak autoryzacji');
            }

            const users = await res.json();
            const tbody = document.getElementById('usersTableBody');
            tbody.innerHTML = '';

            if (users.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" style="text-align: center;">Brak użytkowników</td></tr>';
                return;
            }

            users.forEach(user => {
                const tr = document.createElement('tr');
                // Dostosuj pola (user.username, user.email) do tego, jak nazywają się w Twojej bazie danych
                tr.innerHTML = `
                    <td>${user.username || user.nick || 'Brak'}</td>
                    <td>${user.email || 'Brak'}</td>
                    <td>${user.role || 'Użytkownik'}</td>
                    <td>${user.createdAt ? new Date(user.createdAt).toLocaleDateString('pl-PL') : 'Brak'}</td>
                `;
                tbody.appendChild(tr);
            });

        } catch (err) {
            document.getElementById('usersTableBody').innerHTML = 
                `<tr><td colspan="4" style="text-align: center; color: #ff5252;">Błąd: ${err.message}. Sprawdź, czy jesteś zalogowany jako admin.</td></tr>`;
            
            // Opcjonalnie: przekieruj do logowania, jeśli błąd to 401
            if (err.message.includes('autoryzacji')) {
                setTimeout(() => window.location.href = '/login.html', 2000);
            }
        }
    }

    loadUsers();
</script>

</body>
</html>
