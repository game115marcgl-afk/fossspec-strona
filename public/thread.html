<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wątek - Forum FossSpec</title>
    <style>
        * { box-sizing: border-box; font-family: sans-serif; }
        body { background: #121212; color: #fff; margin: 0; padding: 0; }
        header { background: #1e1e1e; padding: 1rem 2rem; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; }
        h1 { color: #4CAF50; margin: 0; font-size: 1.5rem; }
        .btn { padding: 0.5rem 1rem; border-radius: 4px; text-decoration: none; border: none; cursor: pointer; font-weight: bold; }
        .btn-green { background: #4CAF50; color: white; }
        .btn-gray { background: #333; color: white; }

        main { max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
        .card { background: #1e1e1e; padding: 1.5rem; border-radius: 8px; border: 1px solid #333; margin-bottom: 1.5rem; }
        .badge { background: #2e7d32; color: white; padding: 0.2rem 0.6rem; border-radius: 12px; font-size: 0.8rem; }
        .reply-box { background: #252525; padding: 1rem; border-radius: 6px; margin-bottom: 1rem; border-left: 3px solid #4CAF50; }
        textarea { width: 100%; padding: 0.8rem; background: #2a2a2a; border: 1px solid #444; color: #fff; border-radius: 4px; margin-bottom: 1rem; }
    </style>
</head>
<body>

<header>
    <h1>💬 Forum FossSpec</h1>
    <a href="/" class="btn btn-gray">← Powrót do Forum</a>
</header>

<main>
    <div id="threadContent" class="card">
        <p>Ładowanie wątku...</p>
    </div>

    <h3 style="color: #4CAF50;">Odpowiedzi i Komentarze</h3>
    <div id="repliesContainer"></div>

    <div id="replyFormCard" class="card">
        <h4>Dodaj odpowiedź</h4>
        <form id="replyForm">
            <textarea id="replyContent" rows="3" placeholder="Napisz odpowiedź..." maxlength="5000" required></textarea>
            <button type="submit" class="btn btn-green">Wyślij Odpowiedź</button>
        </form>
    </div>
</main>

<!-- TUTAJ ŁADUJEMY ZEWNĘTRZNY PLIK JS -->
<script src="/js/thread.js"></script>

</body>
</html>
