
<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forum FossSpec</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --bg: #121212;
      --card: #1E1E1E;
      --card-hover: #252525;
      --text-primary: #E0E0E0;
      --text-secondary: #A0A0A0;
      --accent: #00E676;
      --accent-dim: #00C766;
      --border: #2A2A2A;
      --danger: #ff5252;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--text-primary);
      font-family: system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.5;
      min-height: 100vh;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    header {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 10;
      box-shadow: 0 4px 18px rgba(0,0,0,.18);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--accent);
    }

    .logo span {
      font-weight: 700;
      font-size: 1.25rem;
    }

    .user-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: .9rem;
    }

    .btn {
      padding: 9px 18px;
      border-radius: 7px;
      font-size: .9rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: .2s ease;
    }

    .btn-outline {
      background: transparent;
      color: var(--text-primary);
      border: 1px solid var(--border);
    }

    .btn-outline:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .btn-fill {
      background: var(--accent);
      color: #080808;
      box-shadow: 0 4px 14px rgba(0,230,118,.14);
    }

    .btn-fill:hover {
      background: var(--accent-dim);
      transform: translateY(-1px);
    }

    .btn-danger {
      background: var(--danger);
      color: #fff;
    }

    .btn-danger:hover {
      background: #e04848;
    }

    main {
      max-width: 1000px;
      margin: 0 auto;
      padding: 32px 20px 60px;
    }

    .section-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 22px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .section-top h1 {
      font-size: 1.4rem;
      font-weight: 700;
    }

    .card {
      background: var(--card);
      border-radius: 10px;
      border: 1px solid var(--border);
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,.12);
    }

    .thread-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding: 19px 20px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background .2s ease, border-color .2s ease;
    }

    .thread-row:last-child {
      border-bottom: none;
    }

    .thread-row:hover {
      background: var(--card-hover);
      border-left: 3px solid var(--accent);
      padding-left: 17px;
    }

    .badge {
      background: rgba(0,230,118,.15);
      color: var(--accent);
      padding: 3px 10px;
      border-radius: 12px;
      font-size: .75rem;
      font-weight: 600;
      margin-right: 8px;
      display: inline-block;
    }

    .thread-title {
      color: var(--text-primary);
      font-size: 1.05rem;
      font-weight: 600;
    }

    .thread-title:hover {
      color: var(--accent);
    }

    .meta {
      color: var(--text-secondary);
      font-size: .85rem;
      margin-top: 6px;
    }

    .meta strong {
      color: var(--text-primary);
    }

    .empty-state {
      padding: 38px 20px;
      color: var(--text-secondary);
      text-align: center;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.82);
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 16px;
    }

    .modal-content {
      background: var(--card);
      padding: 28px;
      border-radius: 10px;
      width: 100%;
      max-width: 480px;
      border: 1px solid var(--border);
      box-shadow: 0 20px 60px rgba(0,0,0,.45);
    }

    .modal-content h2 {
      color: var(--accent);
      margin-bottom: 18px;
      font-size: 1.2rem;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 11px 12px;
      margin-bottom: 14px;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text-primary);
      border-radius: 7px;
      font-size: .9rem;
      font-family: inherit;
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: 2px solid var(--accent);
      border-color: var(--accent);
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }

    @media (max-width: 640px) {
      header {
        padding: 12px 16px;
      }

      main {
        padding: 24px 14px 50px;
      }

      .section-top {
        align-items: flex-start;
      }

      .section-top .btn {
        width: 100%;
      }

      .thread-row {
        flex-direction: column;
        align-items: flex-start;
      }

      .user-bar {
        gap: 6px;
      }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <span>💬 Forum FossSpec</span>
  </div>
  <div id="userBar" class="user-bar">
    <span style="color: var(--text-secondary);">Ładowanie...</span>
  </div>
</header>

<main>
  <div class="section-top">
    <h1>Dyskusje i Tematy</h1>
    <button id="newThreadBtn" class="btn btn-fill"><i class="fas fa-plus"></i> Załóż Nowy Wątek</button>
  </div>

  <div id="threadsContainer" class="card">
    <p class="empty-state">Ładowanie wątków...</p>
  </div>
</main>

<div id="threadModal" class="modal">
  <div class="modal-content">
    <h2>Stwórz Nowy Wątek</h2>
    <form id="createThreadForm">
      <input type="text" id="title" placeholder="Tytuł wątku" maxlength="150" required>
      <select id="category" required>
        <option value="" disabled selected>Wybierz kategorię...</option>
      </select>
      <textarea id="content" rows="5" placeholder="Treść wątku / Pytanie..." maxlength="10000" required></textarea>
      <div class="modal-actions">
        <button type="button" id="cancelModalBtn" class="btn btn-outline">Anuluj</button>
        <button type="submit" class="btn btn-fill">Opublikuj</button>
      </div>
    </form>
  </div>
</div>

<script src="/js/index.js"></script>

</body>
</html>
