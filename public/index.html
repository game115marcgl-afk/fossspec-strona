<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FossSpec - Strona Główna</title>
    <style>
        * { box-sizing: border-box; font-family: sans-serif; }
        body { background: #121212; color: #fff; margin: 0; padding: 2rem; }
        header { max-width: 900px; margin: 0 auto 2rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 1rem; }
        h1 { color: #4CAF50; margin: 0; }
        .grid { max-width: 900px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem; }
        .card { background: #1e1e1e; padding: 1.5rem; border-radius: 8px; border: 1px solid #333; }
        .badge { background: #2e7d32; color: white; padding: 0.2rem 0.6rem; border-radius: 12px; font-size: 0.8rem; }
        footer { max-width: 900px; margin: 3rem auto 0; text-align: center; border-top: 1px solid #333; padding-top: 1rem; color: #666; }
        a { color: #888; text-decoration: none; }
        a:hover { color: #4CAF50; }
    </style>
</head>
<body>

<header>
    <h1>FossSpec</h1>
    <p>Specyfikacje i Projekt FOSS</p>
</header>

<main>
    <div id="itemsContainer" class="grid">
        <p>Ładowanie wpisów...</p>
    </div>
</main>

<footer>
    <p>© 2026 FossSpec | <a href="/login.html">Panel Admina</a></p>
</footer>

<script>
    async function loadPublicItems() {
        const res = await fetch('/api/items');
        const items = await res.json();
        const container = document.getElementById('itemsContainer');

        if (items.length === 0) {
            container.innerHTML = '<p style="color: #888; grid-column: 1/-1;">Brak dodanych specyfikacji. Zaloguj się do panelu admina, aby dodać pierwsze wpisy!</p>';
            return;
        }

        container.innerHTML = items.map(item => `
            <div class="card">
                <span class="badge">${item.category}</span>
                <h3 style="margin: 0.8rem 0 0.4rem;">${item.title}</h3>
                <small style="color: #777;">Dodano: ${item.date}</small>
                <p style="color: #ccc; margin-top: 1rem;">${item.description}</p>
            </div>
        `).join('');
    }

    loadPublicItems();
</script>

</body>
</html>
