<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FossSpec - Panel Admina</title>
    <style>
        body { background: #121212; color: #fff; font-family: sans-serif; padding: 2rem; margin: 0; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; border-bottom: 1px solid #333; padding-bottom: 1rem; }
        h2 { margin: 0; color: #4CAF50; }
        a { color: #4CAF50; text-decoration: none; }
        a:hover { text-decoration: underline; }
        .nav-links { display: flex; gap: 1rem; align-items: center; }
        button.logout-btn { background: #ff5252; color: white; border: none; padding: 0.6rem 1.2rem; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button.logout-btn:hover { background: #ff1744; }
        button.logout-btn:disabled { background: #666; cursor: not-allowed; }
        .card { background: #1e1e1e; padding: 1.5rem; border-radius: 8px; margin-top: 1rem; }
        .card h3 { color: #4CAF50; margin-top: 0; }
    </style>
</head>
<body>

<header>
    <h2>Panel Admina</h2>
    <div class="nav-links">
        <a href="/">Strona główna</a>
        <a href="/admin-users.html">Członkowie</a>
        <button id="logoutBtn" class="logout-btn">Wyloguj</button>
    </div>
</header>

<div class="card">
    <h3>Dodaj nowy wpis na stronę</h3>
    <p>Formularz dodawania wpisu...</p>
    <button>Dodaj na stronę</button>
</div>

<div class="card">
    <h3>Statystyki</h3>
    <p id="postsList">Ładowanie...</p>
</div>

<script>
    const logoutBtn = document.getElementById('logoutBtn');

    async function api(url, options = {}) {
        return fetch(url, {
            credentials: 'include',
            headers: { 'Content-Type': 'application/json' },
            ...options
        });
    }

    async function init() {
        logoutBtn.disabled = true;

        try {
            const res = await api('/api/me');

            if (res.status === 401) {
                window.location.href = '/login.html';
                return;
            }
            if (!res.ok) {
                throw new Error('Serwer zwrócił błąd: ' + res.status);
            }

            const data = await res.json();
            console.log('Sesja:', data.user);

            const adminRes = await api('/api/users');

            if (adminRes.status === 403) {
                document.getElementById('postsList').textContent =
                    'To konto nie ma roli admin. Nadaj rolę w bazie danych i zaloguj się ponownie.';
                logoutBtn.disabled = false;
                return;
            }
            if (adminRes.status === 401) {
                window.location.href = '/login.html';
                return;
            }
            if (!adminRes.ok) {
                throw new Error('Błąd pobierania danych panelu');
            }

            const users = await adminRes.json();
            document.getElementById('postsList').textContent =
                'Połączono z panelem. Liczba członków forum: ' + users.length;

        } catch (err) {
            console.error(err);
            const el = document.getElementById('postsList');
            if (el) el.textContent = 'Błąd: ' + err.message;
        } finally {
            logoutBtn.disabled = false;
        }
    }

    logoutBtn.addEventListener('click', async () => {
        logoutBtn.disabled = true;
        try {
            await api('/api/logout', { method: 'POST' });
        } catch (err) {
            console.error('Błąd wylogowania:', err);
        } finally {
            localStorage.removeItem('token');
            window.location.href = '/login.html';
        }
    });

    init();
</script>

</body>
</html>
