<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>FossSpec - Panel Admina</title>
    <style>
        * { box-sizing: border-box; font-family: sans-serif; }
        body { background: #121212; color: #fff; margin: 0; padding: 2rem; }
        .container { max-width: 800px; margin: 0 auto; }
        .card { background: #1e1e1e; padding: 1.5rem; border-radius: 8px; margin-bottom: 2rem; border: 1px solid #333; }
        h2 { color: #4CAF50; margin-top: 0; }
        input, textarea, select { width: 100%; padding: 0.8rem; margin-bottom: 1rem; background: #2a2a2a; border: 1px solid #444; color: #fff; border-radius: 4px; }
        button { background: #4CAF50; color: white; border: none; padding: 0.8rem 1.5rem; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background: #45a049; }
        .btn-delete { background: #ff5252; padding: 0.4rem 0.8rem; font-size: 0.85rem; }
        .btn-delete:hover { background: #e04848; }
        .item-row { display: flex; justify-content: space-between; align-items: center; padding: 1rem; border-bottom: 1px solid #333; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Panel Admina</h1>
        <div>
            <a href="/" style="color: #ccc; margin-right: 15px;">Zobacz Stronę</a>
            <button id="logoutBtn" style="background: #555;">Wyloguj</button>
        </div>
    </div>

    <!-- FORMULARZ DODAWANIA -->
    <div class="card">
        <h2>Dodaj nowy wpis na stronę</h2>
        <form id="addForm">
            <input type="text" id="title" placeholder="Tytuł / Nazwa (np. Dell OptiPlex 7010)" required>
            <input type="text" id="category" placeholder="Kategoria (np. Hardware, Software)" required>
            <textarea id="description" rows="4" placeholder="Opis / Specyfikacja..." required></textarea>
            <button type="submit">Dodaj na stronę</button>
        </form>
    </div>

    <!-- LISTA DODANYCH WPISÓW -->
    <div class="card">
        <h2>Istniejące wpisy</h2>
        <div id="itemsList">Ładowanie...</div>
    </div>
</div>

<script>
    async function checkAuth() {
        const res = await fetch('/api/check-auth');
        const data = await res.json();
        if (!data.loggedIn) window.location.href = '/login.html';
        else loadItems();
    }

    async function loadItems() {
        const res = await fetch('/api/items');
        const items = await res.json();
        const list = document.getElementById('itemsList');

        if (items.length === 0) {
            list.innerHTML = '<p style="color: #888;">Brak wpisów. Dodaj pierwszy powyżej!</p>';
            return;
        }

        list.innerHTML = items.map(item => `
            <div class="item-row">
                <div>
                    <strong>${item.title}</strong> <small style="color:#4CAF50">(${item.category})</small>
                    <br><small style="color:#888">${item.date}</small>
                </div>
                <button onclick="deleteItem(${item.id})" class="btn-delete">Usuń</button>
            </div>
        `).join('');
    }

    document.getElementById('addForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const title = document.getElementById('title').value;
        const category = document.getElementById('category').value;
        const description = document.getElementById('description').value;

        const res = await fetch('/api/items', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ title, category, description })
        });

        if (res.ok) {
            document.getElementById('addForm').reset();
            loadItems();
        }
    });

    async function deleteItem(id) {
        if (!confirm('Na pewno usunąć ten wpis?')) return;
        await fetch('/api/items/' + id, { method: 'DELETE' });
        loadItems();
    }

    document.getElementById('logoutBtn').addEventListener('click', async () => {
        await fetch('/api/logout');
        window.location.href = '/login.html';
    });

    checkAuth();
</script>

</body>
</html>
