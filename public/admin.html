<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FossSpec - Panel Admina</title>
    <style>
        body { background: #121212; color: #fff; font-family: sans-serif; padding: 2rem; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; border-bottom: 1px solid #333; padding-bottom: 1rem; }
        a { color: #4CAF50; text-decoration: none; }
        button { background: #ff5252; color: white; border: none; padding: 0.6rem 1.2rem; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background: #ff1744; }
        .card { background: #1e1e1e; padding: 1.5rem; border-radius: 8px; margin-top: 1rem; }
    </style>
</head>
<body>

<header>
    <h2>Panel Admina</h2>
    <div>
        <a href="/">[Zobacz Stronę]</a>
        <button id="logoutBtn" style="margin-left: 1rem;">Wyloguj</button>
    </div>
</header>

<div class="card">
    <h3>Dodaj nowy wpis na stronę</h3>
    <!-- Tutaj Twój formularz dodawania wpisu -->
    <button>Dodaj na stronę</button>
</div>

<div class="card">
    <h3>Istniejące wpisy</h3>
    <p id="postsList">Ładowanie...</p>
</div>

<script>
    // 1. Sprawdzenie uprawnień przy załadowaniu strony
    async function checkAuth() {
        try {
            const res = await fetch('/api/me', { // lub inny endpoint sprawdzający sesję, np. '/api/admin/status'
                method: 'GET',
                credentials: 'include' // ← KLUCZOWE: wysyła ciasteczko sesji do backendu
            });
            
            if (!res.ok) {
                // Jeśli nieautoryzowany, wyrzuć do logowania
                window.location.href = '/login.html';
            }
        } catch (err) {
            window.location.href = '/login.html';
        }
    }

    // 2. Obsługa wylogowywania
    document.getElementById('logoutBtn').addEventListener('click', async () => {
        try {
            // Wywołaj backend, aby zniszczyć sesję
            await fetch('/api/logout', { 
                method: 'POST',
                credentials: 'include' // ← KLUCZOWE: pozwala serwerowi wyczyścić ciasteczko
            });
        } catch (err) {
            console.error('Błąd podczas wylogowywania', err);
        } finally {
            // Wyczyść dane lokalne i przekieruj
            localStorage.removeItem('token');
            window.location.href = '/login.html';
        }
    });

    // Uruchom sprawdzenie przy starcie
    checkAuth();
</script>

</body>
</html>
