<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FossSpec - Logowanie Admina</title>
    <style>
        * { box-sizing: border-box; font-family: sans-serif; }
        body { background: #121212; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: #1e1e1e; padding: 2rem; border-radius: 8px; width: 100%; max-width: 380px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h2 { margin-top: 0; text-align: center; color: #4CAF50; }
        .form-group { margin-bottom: 1.2rem; }
        label { display: block; margin-bottom: 0.4rem; font-size: 0.9rem; color: #ccc; }
        input { width: 100%; padding: 0.7rem; border-radius: 4px; border: 1px solid #333; background: #2a2a2a; color: #fff; }
        input:focus { border-color: #4CAF50; outline: none; }
        button { width: 100%; padding: 0.8rem; background: #4CAF50; border: none; color: white; border-radius: 4px; font-weight: bold; cursor: pointer; }
        button:hover { background: #45a049; }
        .error-msg { color: #ff5252; text-align: center; font-size: 0.9rem; margin-top: 1rem; display: none; }
    </style>
</head>
<body>

<div class="login-card">
    <h2>Panel Admina</h2>
    <form id="loginForm">
        <div class="form-group">
            <label for="username">Login</label>
            <input type="text" id="username" required autocomplete="username">
        </div>
        <div class="form-group">
            <label for="password">Hasło</label>
            <input type="password" id="password" required autocomplete="current-password">
        </div>
        <button type="submit">Zaloguj się</button>
        <div id="errorMsg" class="error-msg">Niepoprawny login lub hasło!</div>
    </form>
</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        const errorMsg = document.getElementById('errorMsg');

        errorMsg.style.display = 'none';

        const res = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
        });

        const data = await res.json();

        if (res.ok && data.success) {
            // Po pomyślnym zalogowaniu przejdź do panelu admina
            window.location.href = '/admin.html';
        } else {
            errorMsg.textContent = data.message || 'Błąd logowania!';
            errorMsg.style.display = 'block';
        }
    });
</script>

</body>
</html>
