<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FossSpec Forum - Rejestracja</title>
    <style>
        * { box-sizing: border-box; font-family: sans-serif; }
        body { background: #121212; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #1e1e1e; padding: 2rem; border-radius: 8px; width: 100%; max-width: 380px; border: 1px solid #333; }
        h2 { color: #4CAF50; margin-top: 0; text-align: center; }
        input { width: 100%; padding: 0.8rem; margin-bottom: 1rem; background: #2a2a2a; border: 1px solid #444; color: #fff; border-radius: 4px; }
        input:focus { border-color: #4CAF50; outline: none; }
        button { width: 100%; background: #4CAF50; color: white; border: none; padding: 0.8rem; border-radius: 4px; font-weight: bold; cursor: pointer; }
        button:hover { background: #45a049; }
        .msg { margin-top: 1rem; text-align: center; font-size: 0.9rem; min-height: 1.2em; }
    </style>
</head>
<body>

<div class="card">
    <h2>Dołącz do Forum FossSpec</h2>
    <form id="regForm">
        <input type="text" id="username" placeholder="Twój Nick" required autocomplete="username" minlength="3" maxlength="30">
        <input type="email" id="email" placeholder="Adres Email" required autocomplete="email">
        <input type="password" id="password" placeholder="Hasło (min. 8 znaków)" required autocomplete="new-password" minlength="8">
        <input type="password" id="password2" placeholder="Powtórz hasło" required autocomplete="new-password" minlength="8">
        <button type="submit">Załóż Konto</button>
        <div id="msg" class="msg"></div>
    </form>
    <p style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: #aaa;">
        Masz już konto? <a href="/login.html" style="color: #4CAF50;">Zaloguj się</a>
    </p>
</div>

<script>
    document.getElementById('regForm').addEventListener('submit', async (e) => {
        e.preventDefault();
  const register = asyncHandler(async (req, res, next) => {
    const username = ensureString(req.body.username);
    const email = ensureString(req.body.email)?.toLowerCase();
    const password = ensureString(req.body.password);
    const ageConsent = req.body.ageConsent === true;

    if (!username || !email || !password) {
        return next(new AppError("Wypełnij wszystkie pola!", 400));
    }
    if (!ageConsent) {
        return next(new AppError("Musisz potwierdzić swój wiek, aby założyć konto.", 400));
    }
    if (username.length < 3 || username.length > 30) {
        return next(new AppError("Nick musi mieć od 3 do 30 znaków.", 400));
    }
    if (!EMAIL_REGEX.test(email)) {
        return next(new AppError("Nieprawidłowy adres e-mail.", 400));
    }
    if (password.length < 8) {
        return next(new AppError("Hasło musi mieć minimum 8 znaków.", 400));
    }

    const existingUser = await User.findOne({ $or: [{ username }, { email }] });
    if (existingUser) {
        return next(new AppError("Użytkownik o takim nicku lub emailu już istnieje!", 400));
    }

    const hashedPassword = await bcrypt.hash(password, 12);
    const code = String(Math.floor(100000 + Math.random() * 900000));
    const hashedCode = await bcrypt.hash(code, 10);

    const user = await User.create({
        username,
        email,
        password: hashedPassword,
        role: "user",
        isVerified: false,
        verifyCode: hashedCode,
        verifyCodeExpiresAt: new Date(Date.now() + 60 * 60 * 1000)
    });

    try {
        await sendVerificationEmail(email, username, code);
    } catch (mailErr) {
        console.error("Blad wysylki e-maila:", mailErr.message);
        await User.deleteOne({ _id: user._id });
        return next(new AppError("Nie udało się wysłać e-maila. Spróbuj później.", 500));
    }

    res.status(201).json({ success: true, message: "Konto utworzone! Sprawdź e-mail.", email });
});
</script>

</body>
</html>
